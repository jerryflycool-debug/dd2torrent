name: Create torrent
on:
  push:
    branches:
      - master
      
env:
  name: "Android Studio and SDK Tools"
  comment: "Android Studio for Windows"
  url: "https://cesuesedu-my.sharepoint.com/personal/mariapaula_martinez_ues_mx/_layouts/15/download.aspx?SourceUrl=%2Fpersonal%2Fmariapaula%5Fmartinez%5Fues%5Fmx%2FDocuments%2FSolidWorks%202025%20SP1%2E1%20Full%20Premium%2Erar"
  file_name: "android-studio-ide-201.7042882-windows.exe"
  piece_size: 23 # Check the README.md for recommended piece size
      
jobs:
  create:
    runs-on: ubuntu-20.04
    steps:
      - name: Install mktorrent
        run: sudo apt-get install mktorrent
        
      - name: Download file
        run: wget -nv -O "$file_name" "$url"
        
      - name: Create torrent using mktorrent
        run: mktorrent -c "$comment" -l $piece_size -o "${name}.torrent" -w "$url" "$file_name"
        
      - name: Upload torrent file
        uses: actions/upload-artifact@v2
        with:
          name: ${{ env.name }}
          path: ${{ env.name }}.torrent
